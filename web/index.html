<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prumo: quadro Kanban interativo com arrastar e soltar, automações, limites WIP e métricas.">
  <title>Prumo</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/prumo.css">
</head>
<body>
  <header class="topo">
    <button class="botao-icone so-celular" data-alternar-lateral aria-label="Abrir quadros"><span class="icone"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span></button>
    <a class="marca" href="./" aria-label="Prumo"><span id="logo" class="logo"></span><span class="marca-nome">Prumo</span></a>
    <div class="titulo">
      <h1 id="titulo-quadro">Prumo</h1>
      <p id="descricao-quadro"></p>
    </div>
    <nav class="vistas" role="tablist" aria-label="Visualização">
      <button role="tab" data-vista="quadro">Quadro</button>
      <button role="tab" data-vista="calendario">Calendário</button>
      <button role="tab" data-vista="painel">Painel</button>
      <button role="tab" data-vista="historico">Histórico</button>
    </nav>
    <label class="busca"><span class="icone"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><input id="busca" type="search" placeholder="Buscar tarefas  /" aria-label="Buscar tarefas"></label>
    <div class="acoes-topo">
      <button id="botao-desfazer" class="botao-icone" data-acao="desfazer" aria-label="Desfazer"><span class="icone"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></span></button>
      <button id="botao-refazer" class="botao-icone" data-acao="refazer" aria-label="Refazer"><span class="icone"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></span></button>
      <button class="botao-icone com-contador" data-acao="notificacoes" aria-label="Notificações"><span class="icone"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg></span><span id="contador-notificacoes" class="contador-bolha" hidden>0</span></button>
      <button class="botao-icone" data-acao="tema" aria-label="Alternar tema"><span class="icone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button>
      <button class="botao-icone" data-acao="menu" aria-label="Menu"><span class="icone"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span></button>
    </div>
  </header>
  <div class="corpo">
    <aside id="lateral" class="lateral" aria-label="Quadros"></aside>
    <main class="principal">
      <div id="filtros" class="filtros" aria-label="Filtros"></div>
      <section id="vista" class="vista"></section>
      <footer class="rodape"><span id="estado-sync">Salvo neste navegador</span><span>Prumo 1.0.0</span></footer>
    </main>
  </div>
  <dialog id="dialogo" class="dialogo"></dialog>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
